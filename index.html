    *{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow-x:hidden}button,input,select{font:inherit}button{border:0;color:inherit;cursor:pointer;min-height:44px}button:active{transform:scale(.96)}a{color:#67b6ff}.app{max-width:680px;margin:auto;min-height:100vh;padding:18px 16px 100px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brand small,.eyebrow{display:block;color:var(--muted);font-size:12px;letter-spacing:.09em;text-transform:uppercase}.brand h1{font-size:23px;margin:3px 0}.icon-btn{width:44px;border-radius:12px;background:var(--card2)}.view{animation:slide .28s ease both}.hidden{display:none!important}@keyframes slide{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
    .week-strip{display:flex;gap:9px;overflow:auto;margin:0 -16px 20px;padding:0 16px 8px;scrollbar-width:none}.week-strip::-webkit-scrollbar{display:none}.week{background:var(--card);border:1px solid var(--border);border-radius:13px;min-width:112px;padding:10px;text-align:left}.week.active{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset}.week b{display:block}.week span{font-size:11px;color:var(--muted);display:block;margin-top:4px}.progress{height:6px;border-radius:9px;background:var(--card2);overflow:hidden;margin-top:9px}.progress i{display:block;height:100%;background:var(--green);transition:width .4s ease}
    .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin:12px 0;box-shadow:var(--shadow);animation:reveal .4s both}.card:nth-of-type(2){animation-delay:.05s}.card:nth-of-type(3){animation-delay:.1s}.card:nth-of-type(4){animation-delay:.15s}@keyframes reveal{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.day-card{border-left:4px solid var(--accent,var(--red));display:flex;align-items:center;gap:13px}.day-card .main{flex:1}.day-card h3{margin:1px 0 4px;font-size:17px}.day-card p{margin:0;color:var(--muted);font-size:13px}.pill{font-size:11px;color:var(--muted);border:1px solid var(--border);padding:4px 7px;border-radius:99px}.done{color:var(--green);font-size:24px;animation:pop .3s both}@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}.btn{border-radius:11px;background:var(--card2);padding:10px 13px;font-weight:650}.btn.primary{background:var(--red);color:white}.btn.green{background:var(--green);color:#052e20}.btn.danger{background:#ef444422;color:#f87171}.btn.full{width:100%}.row{display:flex;gap:9px;align-items:center}.row.wrap{flex-wrap:wrap}.spacer{flex:1}.section-title{margin:25px 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
    .session-head{display:flex;gap:10px;align-items:center}.session-head h2{font-size:20px;margin:0}.exercise{border-left:3px solid var(--border)}.exercise.priority{border-left-color:var(--amber)}.exercise h3{margin:0 0 7px;font-size:16px}.muscles{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}.muscles span{font-size:11px;padding:4px 7px;border-radius:8px;background:#0ea5e922;color:#7dd3fc}.set-grid{display:grid;grid-template-columns:34px 1fr 1fr;gap:7px;align-items:center}.set-grid label{color:var(--muted);text-align:center}.set-grid input,.setting input{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:10px;color:var(--text);min-height:44px;padding:9px}.set-grid input:valid:not(:placeholder-shown){border-color:var(--green);animation:flash .5s}@keyframes flash{50%{background:#10b9812e}}.exercise-tools{display:flex;align-items:center;gap:10px;margin:12px 0 0}.demo{margin-top:10px;max-height:0;overflow:hidden;transition:max-height .35s ease}.demo.open{max-height:260px}.demo img{width:100%;max-height:230px;object-fit:contain;border-radius:10px;background:#000}.ex-head{display:flex;align-items:center;gap:12px;margin-bottom:8px}.ex-thumb{width:56px;height:56px;border-radius:12px;object-fit:cover;background:var(--card2);flex-shrink:0;cursor:pointer;border:2px solid var(--border);transition:.2s}.ex-thumb:active{border-color:var(--red);transform:scale(.93)}.ex-thumb-ph{width:56px;height:56px;border-radius:12px;background:var(--card2);flex-shrink:0;display:grid;place-items:center;color:var(--faint);cursor:pointer;border:2px dashed var(--border);font-size:18px;transition:.2s}.ex-thumb-ph:active{border-color:var(--red);color:var(--red)}.timer{position:relative;width:58px;height:58px;background:transparent;padding:0}.timer svg{width:58px;height:58px;transform:rotate(-90deg)}.timer circle{fill:none;stroke:var(--border);stroke-width:5}.timer .arc{stroke:var(--amber);stroke-linecap:round;stroke-dasharray:151;transition:stroke-dashoffset .8s linear}.timer b{position:absolute;inset:0;display:grid;place-items:center;font-size:12px}.timer.done .arc{stroke:var(--green)}
    .setting{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px}.setting p{margin:2px 0 0;color:var(--muted);font-size:12px}.switch{appearance:none;width:48px;height:28px;border-radius:99px;background:var(--border);position:relative;min-height:0}.switch:checked{background:var(--red)}.switch:before{content:"";position:absolute;left:4px;top:4px;width:20px;height:20px;border-radius:50%;background:white;transition:.2s}.switch:checked:before{transform:translateX(20px)}.history{display:flex;align-items:center;gap:10px}.history .date{color:var(--muted);font-size:12px}.list-input{display:grid;grid-template-columns:1fr 44px 44px 44px;gap:6px}.list-input input{background:var(--card2);border:1px solid var(--border);border-radius:9px;color:var(--text);padding:8px}.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-120px);background:var(--card2);border:1px solid var(--border);padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);z-index:9;transition:.3s}.toast.show{transform:translate(-50%,0)}.celebrate{position:fixed;inset:0;background:#020617df;z-index:10;display:grid;place-content:center;text-align:center}.celebrate .mark{font-size:82px;color:var(--green);animation:pop .55s both}.celebrate h2{margin:0;font-size:30px}.dot{position:absolute;border-radius:50%;width:10px;height:10px;background:var(--red);animation:confetti 2.4s ease-in infinite}@keyframes confetti{from{transform:translateY(30px);opacity:1}to{transform:translateY(-70vh) rotate(360deg);opacity:0}}.empty{text-align:center;padding:30px;color:var(--muted)}
    .fab{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));right:20px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#e94560,#0f3460);color:white;font-size:22px;display:grid;place-items:center;box-shadow:0 6px 20px #e9456066;z-index:8;animation:pop .4s both;min-height:0}.ai-msg{padding:14px;border-radius:14px;margin:10px 0;animation:reveal .3s both;line-height:1.55;font-size:14px}.ai-msg.user{background:var(--card2);border:1px solid var(--border)}.ai-msg.ai{background:var(--blue);background:linear-gradient(135deg,#0f346018,#e9456010);border:1px solid #0f346040}.ai-msg b{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.coach-input{display:flex;gap:8px;position:sticky;bottom:0;padding:12px 0;background:var(--bg)}.coach-input input{flex:1;background:var(--card2);border:1px solid var(--border);border-radius:12px;color:var(--text);padding:10px 14px;min-height:44px}.coach-quick{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.coach-quick button{font-size:13px;padding:8px 12px;min-height:38px}.ai-setup{text-align:center;padding:24px 16px}.ai-setup i.big{font-size:48px;color:var(--red);margin-bottom:14px}.ai-setup h3{margin:8px 0}.ai-setup p{color:var(--muted);font-size:13px;margin:6px 0 16px}.ai-setup a{color:var(--red);font-weight:600}.key-input{display:flex;gap:8px;margin-top:12px}.key-input input{flex:1;background:var(--card2);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:9px;font-size:13px;min-height:44px}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}.ai-loading{text-align:center;padding:16px;color:var(--muted);animation:pulse 1.2s ease-in-out infinite}
  </style>

<body><main class="app">
  <header class="topbar"><div class="brand"><small>Train with John</small><h1 id="title">Your training</h1></div><button class="icon-btn" onclick="showView('settings')" aria-label="Settings"><i class="fa-solid fa-gear"></i></button></header>
  <section id="home" class="view"></section><section id="workout" class="view hidden"></section><section id="history" class="view hidden"></section><section id="settings" class="view hidden"></section><section id="customize" class="view hidden"></section><section id="coach" class="view hidden"></section>
</main><button class="fab" onclick="showView('coach')" aria-label="AI Coach"><i class="fa-solid fa-robot"></i></button><div id="toast" class="toast"></div><div id="celebrate" class="celebrate hidden"><div class="mark"><i class="fa-solid fa-circle-check"></i></div><h2>Workout Complete!</h2><p>Great work — recovery starts now.</p></div>
<script>
const DEFAULT_PLAN={upper_a:{id:'upper_a',label:'Upper A',subtitle:'Back + Shoulders (Strength)',day:'Day 1',color:'#e94560',weekday:'Monday',exercises:[['barbell_row','Barbell Row',4,'6-8',120,1],['db_shoulder_press','Seated DB Shoulder Press',4,'6-10',90,1],['cable_lat_raise_a','Cable Lateral Raise',4,'12-18',45,1],['flat_chest_press','Flat DB / Machine Press',3,'8-10',75],['face_pull','Face Pull',3,'15-20',60]]},lower_a:{id:'lower_a',label:'Lower A',subtitle:'Legs (Maint) + Core',day:'Day 2',color:'#0f3460',weekday:'Tuesday',exercises:[['leg_press','Leg Press / Squat',3,'8-10',90],['rdl','Romanian Deadlift',3,'8-10',90,1],['hanging_leg_raise','Hanging Leg Raise',3,'10-15',60,1],['pallof_press','Pallof Press',3,'10/side',45,1],['dead_bug','Dead Bug',2,'8/side',45,1]]},upper_b:{id:'upper_b',label:'Upper B',subtitle:'Shoulders + Back (Volume)',day:'Day 3',color:'#e94560',weekday:'Thursday',exercises:[['lat_pulldown','Lat Pulldown (Wide)',4,'8-12',90,1],['cable_lat_raise_b','Cable Lateral Raise',4,'15-20',45,1],['chest_sup_row','Chest-Supported DB Row',3,'10-12',75,1],['rear_delt_fly','Rear Delt Cable Fly',3,'15-20',45],['incline_db_press','Incline DB Press',3,'8-10',75]]},lower_b:{id:'lower_b',label:'Lower B',subtitle:'Legs (Light) + Core + Cardio',day:'Day 4',color:'#0f3460',weekday:'Friday',exercises:[['hip_thrust','Hip Thrust',3,'10-12',90,1],['walking_lunge','Walking Lunge',2,'10/leg',75],['ab_wheel','Ab Wheel Rollout',3,'8-12',60,1],['plank','Plank',3,'30-60s',30,1]]}};
const PLAN_ORDER=['upper_a','lower_a','upper_b','lower_b'];
const INFO={barbell_row:['Back|Lats|Rhomboids','https://musclewiki.com/barbell/male/back/barbell-bent-over-row','https://weighttraining.guide/wp-content/uploads/2016/10/Barbell-Bent-Over-Row.gif'],db_shoulder_press:['Shoulders|Front Delt|Triceps','https://musclewiki.com/dumbbells/male/shoulders/dumbbell-seated-overhead-press','https://weighttraining.guide/wp-content/uploads/2016/05/Dumbbell-Shoulder-Press.gif'],cable_lat_raise_a:['Shoulders|Side Delt','https://musclewiki.com/cables/male/shoulders/cable-lateral-raise','https://weighttraining.guide/wp-content/uploads/2017/01/cable-one-arm-lateral-raise.gif'],cable_lat_raise_b:['Shoulders|Side Delt','https://musclewiki.com/cables/male/shoulders/cable-lateral-raise','https://weighttraining.guide/wp-content/uploads/2017/01/cable-one-arm-lateral-raise.gif'],flat_chest_press:['Chest|Triceps','https://musclewiki.com/dumbbells/male/chest/dumbbell-bench-press','https://weighttraining.guide/wp-content/uploads/2016/12/Dumbbell-Press.gif'],face_pull:['Rear Delt|Upper Back','https://musclewiki.com/cables/male/rear-deltoid/cable-face-pull','https://weighttraining.guide/wp-content/uploads/2022/01/Cable-Face-Pull.gif'],leg_press:['Quads|Glutes','https://musclewiki.com/machine/male/quads/machine-leg-press','https://weighttraining.guide/wp-content/uploads/2016/05/Leg-Press.gif'],rdl:['Hamstrings|Glutes|Lower Back','https://musclewiki.com/barbell/male/hamstrings/barbell-romanian-deadlift','https://weighttraining.guide/wp-content/uploads/2017/09/barbell-romanian-deadlift.gif'],hanging_leg_raise:['Abs|Hip Flexors','https://musclewiki.com/bodyweight/male/abs/hanging-leg-raise','https://weighttraining.guide/wp-content/uploads/2021/08/Hanging-Leg-Raise.gif'],pallof_press:['Core|Obliques','https://musclewiki.com/cables/male/abs/cable-pallof-press','https://weighttraining.guide/wp-content/uploads/2020/08/Pallof-Press.gif'],dead_bug:['Core|Deep Abs','https://musclewiki.com/bodyweight/male/abs/dead-bug','https://weighttraining.guide/wp-content/uploads/2021/08/Dead-Bug.gif'],lat_pulldown:['Back|Lats|Biceps','https://musclewiki.com/cables/male/lats/cable-lat-pulldown','https://weighttraining.guide/wp-content/uploads/2016/05/Wide-Grip-Lat-Pulldown.gif'],chest_sup_row:['Back|Rhomboids|Rear Delt','https://musclewiki.com/dumbbells/male/back/dumbbell-chest-supported-row','https://weighttraining.guide/wp-content/uploads/2022/11/Chest-Supported-Dumbbell-Row.gif'],rear_delt_fly:['Rear Delt|Upper Back','https://musclewiki.com/cables/male/rear-deltoid/cable-reverse-fly','https://weighttraining.guide/wp-content/uploads/2018/11/Cable-Rear-Delt-Fly.gif'],incline_db_press:['Upper Chest|Shoulders','https://musclewiki.com/dumbbells/male/chest/dumbbell-incline-bench-press','https://weighttraining.guide/wp-content/uploads/2016/12/incline-dumbbell-press.gif'],hip_thrust:['Glutes|Hamstrings','https://musclewiki.com/barbell/male/glutes/barbell-hip-thrust','https://weighttraining.guide/wp-content/uploads/2016/05/Barbell-Hip-Thrust.gif'],walking_lunge:['Quads|Glutes','https://musclewiki.com/dumbbells/male/quads/dumbbell-lunge','https://weighttraining.guide/wp-content/uploads/2016/10/Dumbbell-Lunge.gif'],ab_wheel:['Core|Abs|Shoulders','https://musclewiki.com/bodyweight/male/abs/ab-wheel','https://weighttraining.guide/wp-content/uploads/2016/10/Ab-Wheel-Rollout.gif'],plank:['Core|Full Abs','https://musclewiki.com/bodyweight/male/abs/plank','https://weighttraining.guide/wp-content/uploads/2021/06/Front-Plank.gif']};
const clone=o=>JSON.parse(JSON.stringify(o)); const load=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))||fallback}catch(e){return fallback}};let exercisePhotos=load('ph2_exercise_photos',{});function compressPhoto(file,sz=200){return new Promise(r=>{let rd=new FileReader;rd.onload=e=>{let img=new Image;img.onload=()=>{let c=document.createElement('canvas'),w=img.width,h=img.height;if(w>sz||h>sz){if(w>h){h=h*sz/w;w=sz}else{w=w*sz/h;h=sz}}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);r(c.toDataURL('image/jpeg',.7))};img.src=e.target.result};rd.readAsDataURL(file)})}function addExPhoto(id){let inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=async()=>{if(!inp.files[0])return;exercisePhotos[id]=await compressPhoto(inp.files[0]);localStorage.setItem('ph2_exercise_photos',JSON.stringify(exercisePhotos));renderWorkout();toast('Photo saved')};inp.click()}function removeExPhoto(id){delete exercisePhotos[id];localStorage.setItem('ph2_exercise_photos',JSON.stringify(exercisePhotos));renderWorkout();toast('Photo removed')}
let state={plan:load('ph2_plan',clone(DEFAULT_PLAN)),history:load('ph2_history',[]),settings:Object.assign({startDate:localStorage.getItem('ph2_start_date')||new Date().toISOString().slice(0,10),targetWeight:'73',targetWaist:'',theme:'dark',restSound:true,units:'kg',openaiKey:''},load('ph2_settings',{})),week:1,active:null,edit:null,timer:null};
function save(){localStorage.setItem('ph2_plan',JSON.stringify(state.plan));localStorage.setItem('ph2_history',JSON.stringify(state.history));localStorage.setItem('ph2_settings',JSON.stringify(state.settings));localStorage.setItem('ph2_start_date',state.settings.startDate);document.documentElement.dataset.theme=state.settings.theme}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))} function date(d){return new Date(d+'T12:00:00')}
function weekDates(n){let s=date(state.settings.startDate);s.setDate(s.getDate()+(n-1)*7);let e=new Date(s);e.setDate(e.getDate()+6);let opt={month:'short',day:'numeric'};return s.toLocaleDateString(undefined,opt)+' – '+e.toLocaleDateString(undefined,opt)}
function sessionWeek(s){return Math.max(1,Math.floor((date(s.date)-date(state.settings.startDate))/86400000/7)+1)}
function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}
function showView(id){document.querySelectorAll('.view').forEach(v=>v.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.getElementById('title').textContent=id==='home'?'Your training':id[0].toUpperCase()+id.slice(1);if(id==='home')renderHome();if(id==='history')renderHistory();if(id==='settings')renderSettings();if(id==='customize')renderCustomize();if(id==='coach')renderCoach();window.scrollTo({top:0,behavior:'smooth'})}
function renderHome(){let completed=state.history.filter(s=>sessionWeek(s)===state.week);let ws='';for(let n=1;n<=12;n++){let c=state.history.filter(s=>sessionWeek(s)===n).length;ws+='<button class="week '+(n===state.week?'active':'')+'" onclick="state.week='+n+';renderHome()"><b>Week '+n+'</b><span>'+weekDates(n)+'</span><div class="progress"><i style="width:'+Math.min(100,c/4*100)+'%"></i></div><span>'+c+'/4 sessions</span></button>'}let cards=Object.values(state.plan).map(p=>{let done=completed.some(s=>s.dayId===p.id);return '<article class="card day-card" style="--accent:'+p.color+'"><div class="main"><span class="eyebrow">'+esc(p.day)+' · '+esc(p.weekday)+'</span><h3>'+esc(p.label)+'</h3><p>'+esc(p.subtitle)+'</p></div>'+(done?'<i class="fa-solid fa-circle-check done"></i>':'<button class="btn primary" onclick="startWorkout(\''+p.id+'\')">Start</button>')+'</article>'}).join('');document.getElementById('home').innerHTML='<div class="week-strip">'+ws+'</div><div class="row"><b>Week '+state.week+'</b><span class="spacer"></span><button class="btn" onclick="showView(\'history\')"><i class="fa-solid fa-chart-line"></i> History</button></div>'+cards+'<div class="row"><button class="btn full" onclick="showView(\'customize\')"><i class="fa-solid fa-sliders"></i> Customize plan</button></div>'}
function youtubeUrl(name){return 'https://www.youtube.com/results?search_query='+encodeURIComponent(name+' exercise proper form')}
function startWorkout(id,edit){state.active=clone(state.plan[id]);state.edit=edit||null;renderWorkout();showView('workout')}
function renderWorkout(){let p=state.active;if(!p)return;let prior=state.edit&&state.edit.entries||{};let exercises=p.exercises.map((x,ei)=>{let i=INFO[x[0]]||['Custom exercise','',''];let sets='';for(let n=0;n<x[2];n++){let v=prior[x[0]]&&prior[x[0]][n]||{};sets+='<div class="set-grid"><label>'+ (n+1) +'</label><input inputmode="decimal" placeholder="kg" value="'+esc(v.weight||'')+'" data-ex="'+x[0]+'" data-set="'+n+'" data-field="weight"><input inputmode="numeric" placeholder="reps" value="'+esc(v.reps||'')+'" data-ex="'+x[0]+'" data-set="'+n+'" data-field="reps"></div>'}let ph=exercisePhotos[x[0]];return '<article class="card exercise '+(x[5]?'priority':'')+'"><div class="ex-head">'+(ph?'<img class="ex-thumb" src="'+ph+'" alt="" loading="lazy" onclick="addExPhoto(\''+x[0]+'\')">':'<div class="ex-thumb-ph" onclick="addExPhoto(\''+x[0]+'\')"><i class="fa-solid fa-camera"></i></div>')+'<div><h3>'+esc(x[1])+'</h3><div class="muscles">'+i[0].split('|').map(m=>'<span>'+m+'</span>').join('')+'</div></div></div><div class="row"><span class="pill">'+x[2]+' sets</span><span class="pill">'+esc(x[3])+' reps</span><span class="pill">'+x[4]+'s rest</span><span class="spacer"></span><button class="timer" id="timer-'+ei+'" onclick="runTimer('+ei+','+x[4]+')"><svg viewBox="0 0 58 58"><circle cx="29" cy="29" r="24"></circle><circle class="arc" cx="29" cy="29" r="24"></circle></svg><b>'+x[4]+'</b></button></div><div class="exercise-tools"><button class="btn" onclick="addExPhoto(\''+x[0]+'\')"><i class="fa-solid fa-camera"></i> '+(ph?'Change':'Add')+' photo</button>'+(ph?'<button class="btn" onclick="removeExPhoto(\''+x[0]+'\')"><i class="fa-solid fa-xmark"></i></button>':'')+'<button class="btn" onclick="toggleDemo('+ei+')"><i class="fa-solid fa-person-running"></i> Demo</button><a href="'+youtubeUrl(x[1])+'" target="_blank" rel="noopener">Watch on YouTube <i class="fa-solid fa-arrow-up-right-from-square"></i></a></div><div id="demo-'+ei+'" class="demo">'+(i[2]?'<img src="'+i[2]+'" alt="Movement demonstration: '+esc(x[1])+'" loading="lazy" onerror="this.parentElement.innerHTML=\'Movement image unavailable. Use the YouTube guide for this exercise.\'">':'<p class="date">Use the YouTube guide for this custom exercise.</p>')+'</div><div style="margin-top:12px">'+sets+'</div></article>'}).join('');document.getElementById('workout').innerHTML='<div class="session-head"><button class="icon-btn" onclick="showView(\'home\')"><i class="fa-solid fa-arrow-left"></i></button><div><h2>'+esc(p.label)+'</h2><span class="eyebrow">'+esc(p.subtitle)+'</span></div></div>'+exercises+'<button class="btn green full" onclick="finishWorkout()"><i class="fa-solid fa-circle-check"></i> '+(state.edit?'Save changes':'Finish workout')+'</button>'}
function toggleDemo(i){document.getElementById('demo-'+i).classList.toggle('open')}function runTimer(i,total){if(state.timer){clearInterval(state.timer);state.timer=null;toast('Rest timer skipped');return}let el=document.getElementById('timer-'+i),left=total;el.classList.remove('done');let tick=()=>{let pct=151*(1-left/total);el.querySelector('.arc').style.strokeDashoffset=pct;el.querySelector('b').textContent=left;if(left--<=0){clearInterval(state.timer);state.timer=null;el.classList.add('done');el.querySelector('b').textContent='✓';navigator.vibrate&&navigator.vibrate(300);if(state.settings.restSound)try{new AudioContext().createOscillator().start()}catch(e){}}};tick();state.timer=setInterval(tick,1000)}
function collect(){let entries={};document.querySelectorAll('[data-ex]').forEach(i=>{let e=i.dataset.ex,s=i.dataset.set;entries[e]=entries[e]||[];entries[e][s]=entries[e][s]||{};entries[e][s][i.dataset.field]=i.value});return entries}
function finishWorkout(){let entry={id:state.edit?state.edit.id:Date.now().toString(),dayId:state.active.id,label:state.active.label,date:state.edit?state.edit.date:new Date().toISOString().slice(0,10),entries:collect()};if(state.edit)state.history=state.history.map(s=>s.id===entry.id?entry:s);else state.history.unshift(entry);save();document.getElementById('celebrate').classList.remove('hidden');setTimeout(()=>{document.getElementById('celebrate').classList.add('hidden');showView('home')},2500)}
function renderHistory(){let list=state.history.map(s=>'<article class="card history"><i class="fa-solid fa-dumbbell"></i><div class="main"><b>'+esc(s.label)+'</b><div class="date">'+new Date(s.date+'T12:00').toLocaleDateString()+' · Week '+sessionWeek(s)+'</div></div><button class="icon-btn" onclick="editSession(\''+s.id+'\')" aria-label="Edit"><i class="fa-solid fa-pen"></i></button><button class="icon-btn" onclick="deleteSession(\''+s.id+'\')" aria-label="Delete"><i class="fa-solid fa-trash"></i></button></article>').join('')||'<div class="empty">Your completed workouts will appear here.</div>';document.getElementById('history').innerHTML='<button class="btn" onclick="showView(\'home\')"><i class="fa-solid fa-arrow-left"></i> Home</button><h2>Session history</h2>'+list}
function editSession(id){let s=state.history.find(x=>x.id===id);startWorkout(s.dayId,s)}function deleteSession(id){if(confirm('Delete this saved workout?')){state.history=state.history.filter(s=>s.id!==id);save();renderHistory();toast('Session deleted')}}
function renderSettings(){let s=state.settings;document.getElementById('settings').innerHTML='<button class="btn" onclick="showView(\'home\')"><i class="fa-solid fa-arrow-left"></i> Home</button><h2>Settings</h2><div class="card setting"><div><b>Week 1 start date</b><p>Used for your 12-week program</p></div><input type="date" value="'+s.startDate+'" onchange="state.settings.startDate=this.value;save();renderHome()"></div><div class="card setting"><div><b>Target weight</b><p>Your personal goal</p></div><input inputmode="decimal" value="'+esc(s.targetWeight)+'" onchange="state.settings.targetWeight=this.value;save()"></div><div class="card setting"><div><b>Target waist</b><p>Optional measurement</p></div><input inputmode="decimal" value="'+esc(s.targetWaist)+'" onchange="state.settings.targetWaist=this.value;save()"></div><div class="card setting"><div><b>Light mode</b><p>Switch the visual theme</p></div><input class="switch" type="checkbox" '+(s.theme==='light'?'checked':'')+' onchange="state.settings.theme=this.checked?\'light\':\'dark\';save();renderSettings()"></div><div class="card setting"><div><b>Rest timer sound</b><p>Sound and vibration on completion</p></div><input class="switch" type="checkbox" '+(s.restSound?'checked':'')+' onchange="state.settings.restSound=this.checked;save()"></div><div class="card setting"><div><b>Units</b><p>Weight display preference</p></div><button class="btn" onclick="state.settings.units=state.settings.units===\'kg\'?\'lbs\':\'kg\';save();renderSettings()">'+s.units+'</button></div><div class="section-title">AI Coach</div><div class="card setting"><div><b>OpenAI API key</b><p>Get one at <a href="https://platform.openai.com/api-keys" target="_blank" rel="noopener">platform.openai.com</a></p></div><input type="password" placeholder="sk-…" value="'+esc(s.openaiKey||'')+'" onchange="state.settings.openaiKey=this.value.trim();save();toast(\'API key saved\')"></div><div class="section-title">Data</div><div class="row wrap"><button class="btn" onclick="exportData()"><i class="fa-solid fa-download"></i> Export</button><button class="btn" onclick="document.getElementById(\'importer\').click()"><i class="fa-solid fa-upload"></i> Import</button><input id="importer" class="hidden" type="file" accept="application/json" onchange="importData(this.files[0])"><button class="btn" onclick="showView(\'customize\')">Customize plan</button></div><button class="btn danger full" style="margin-top:18px" onclick="resetData()">Reset all data</button><p class="empty">Train with John · V2.0.0</p>'}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({history:state.history,plan:state.plan,settings:state.settings,bodyStats:load('ph2_body_stats',[]),exercisePhotos},null,2)],{type:'application/json'}));a.download='train-with-john-backup.json';a.click();URL.revokeObjectURL(a.href);toast('Backup downloaded')}function importData(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.history)||!d.plan||!d.settings)throw Error();state.history=d.history;state.plan=d.plan;state.settings=Object.assign(state.settings,d.settings);if(d.exercisePhotos){Object.assign(exercisePhotos,d.exercisePhotos);localStorage.setItem('ph2_exercise_photos',JSON.stringify(exercisePhotos))}save();showView('home');toast('Backup restored')}catch(e){alert('That file is not a valid Train with John backup.')}};r.readAsText(file)}function resetData(){if(!confirm('Are you sure you want to reset all data?'))return;let t=prompt('This cannot be undone. Type DELETE to confirm.');if(t==='DELETE'){['ph2_history','ph2_body_stats','ph2_plan','ph2_settings','ph2_start_date','ph2_exercise_photos'].forEach(k=>localStorage.removeItem(k));location.reload()}}
function renderCustomize(){let days=Object.values(state.plan).map(p=>'<article class="card"><div class="row"><div class="main"><b>'+esc(p.label)+'</b><p class="date">'+esc(p.subtitle)+'</p></div><button class="icon-btn" onclick="removeDay(\''+p.id+'\')" aria-label="Remove day"><i class="fa-solid fa-trash"></i></button></div><div style="margin-top:12px">'+p.exercises.map((x,i)=>'<div class="list-input" style="margin:6px 0"><input value="'+esc(x[1])+'" onchange="updateExercise(\''+p.id+'\','+i+',\'name\',this.value)"><input inputmode="numeric" value="'+x[2]+'" onchange="updateExercise(\''+p.id+'\','+i+',\'sets\',this.value)"><button class="icon-btn" onclick="moveExercise(\''+p.id+'\','+i+',-1)"><i class="fa-solid fa-arrow-up"></i></button><button class="icon-btn" onclick="removeExercise(\''+p.id+'\','+i+')"><i class="fa-solid fa-minus"></i></button></div>').join('')+'</div><button class="btn" style="margin-top:8px" onclick="addExercise(\''+p.id+'\')"><i class="fa-solid fa-plus"></i> Add exercise</button></article>').join('');document.getElementById('customize').innerHTML='<button class="btn" onclick="showView(\'home\')"><i class="fa-solid fa-arrow-left"></i> Home</button><h2>Customize plan</h2><p class="date">Change exercises, set counts, and order. Changes save automatically.</p>'+days+'<div class="row wrap"><button class="btn primary" onclick="addDay()"><i class="fa-solid fa-plus"></i> Add training day</button><button class="btn danger" onclick="if(confirm(\'Restore the original four-day plan?\')){state.plan=clone(DEFAULT_PLAN);save();renderCustomize()}">Reset default plan</button></div>'}
function updateExercise(day,i,k,v){let x=state.plan[day].exercises[i];if(k==='name')x[1]=v;else x[2]=Math.max(1,Number(v)||1);save()}function removeExercise(d,i){state.plan[d].exercises.splice(i,1);save();renderCustomize()}function moveExercise(d,i,by){let a=state.plan[d].exercises,j=i+by;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();renderCustomize()}function addExercise(d){let name=prompt('Exercise name');if(!name)return;state.plan[d].exercises.push(['custom_'+Date.now(),name,3,'8-12',60]);save();renderCustomize()}function addDay(){let name=prompt('Name for the new training day');if(!name)return;let id='custom_'+Date.now();state.plan[id]={id,label:name,subtitle:'Custom training day',day:'Day '+(Object.keys(state.plan).length+1),color:'#e94560',weekday:'Custom',exercises:[]};save();renderCustomize()}function removeDay(id){if(Object.keys(state.plan).length<=1)return toast('Keep at least one training day');if(confirm('Remove this entire training day?')){delete state.plan[id];save();renderCustomize()}}
let coachMsgs=[];
function fmtAI(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\*\*(.*?)\*\*/g,'<b>$1</b>').replace(/\*(.*?)\*/g,'<i>$1</i>').replace(/^[-•] (.+)/gm,'<span style="display:block;padding-left:16px;text-indent:-12px;margin:3px 0">• $1</span>').replace(/^\d+\. (.+)/gm,'<span style="display:block;padding-left:16px;margin:3px 0">$&</span>').replace(/\n/g,'<br>')}
function buildCtx(){let pl=Object.values(state.plan).map(p=>p.label+' ('+p.subtitle+'): '+p.exercises.map(x=>x[1]+' '+x[2]+'×'+x[3]).join(', ')).join('\n');let rc=state.history.slice(0,10).map(s=>{let d=Object.entries(s.entries||{}).map(([e,sets])=>{let nm=(Object.values(state.plan).flatMap(p=>p.exercises).find(x=>x[0]===e)||['',e])[1];return nm+': '+sets.filter(Boolean).map((v,i)=>(v.weight||'?')+state.settings.units+'×'+(v.reps||'?')).join(', ')}).join('; ');return s.label+' ('+s.date+', Wk'+sessionWeek(s)+'): '+d}).join('\n');return 'You are an expert personal trainer AI coach embedded in the "Train with John" workout tracking app. You analyze the user\'s actual workout data to give specific, actionable advice.\n\nCONTEXT:\n- Week '+state.week+' of 12-week program\n- Target weight: '+(state.settings.targetWeight||'not set')+state.settings.units+'\n- Target waist: '+(state.settings.targetWaist||'not set')+'\n- Units: '+state.settings.units+'\n- Total sessions logged: '+state.history.length+'\n\nCURRENT PLAN:\n'+pl+'\n\nRECENT SESSIONS (newest first):\n'+(rc||'No sessions logged yet.')+'\n\nRULES:\n- Reference specific exercises and numbers from their data\n- Be concise: bullet points, under 200 words\n- Give actionable recommendations (exact weight increases, rep targets)\n- Consider progressive overload principles\n- Flag any muscle imbalances or missing movement patterns\n- Be encouraging but honest'}
async function callAI(q){let k=state.settings.openaiKey;if(!k){toast('Add your OpenAI API key in Settings');showView('settings');return null}let el=document.getElementById('coach-loading');if(el)el.classList.remove('hidden');try{let r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},body:JSON.stringify({model:'gpt-4o-mini',messages:[{role:'system',content:buildCtx()},{role:'user',content:q}],temperature:.7,max_tokens:1024})});let d=await r.json();if(d.error)throw Error(d.error.message);return d.choices[0].message.content}catch(e){toast('AI error: '+e.message);return null}finally{if(el)el.classList.add('hidden')}}
async function askCoach(q){coachMsgs.push({role:'user',text:q});renderCoachMsgs();let a=await callAI(q);if(a){coachMsgs.push({role:'ai',text:a});renderCoachMsgs();let m=document.getElementById('coach-msgs');m.lastChild.scrollIntoView({behavior:'smooth'})}}
function sendCoach(){let inp=document.getElementById('coach-q');let q=inp.value.trim();if(!q)return;inp.value='';askCoach(q)}
function renderCoachMsgs(){let el=document.getElementById('coach-msgs');if(!el)return;el.innerHTML=coachMsgs.map(m=>'<div class="ai-msg '+(m.role==='user'?'user':'ai')+'">'+(m.role==='user'?'<b><i class="fa-solid fa-user"></i> You</b><div>'+esc(m.text)+'</div>':'<b><i class="fa-solid fa-robot"></i> AI Coach</b><div>'+fmtAI(m.text)+'</div>')+'</div>').join('')}
function renderCoach(){let k=state.settings.openaiKey;let setup=!k?'<div class="card ai-setup"><i class="fa-solid fa-robot big"></i><h3>Set up AI Coach</h3><p>Get personalized training advice powered by ChatGPT.</p><p>1. Go to <a href="https://platform.openai.com/api-keys" target="_blank" rel="noopener">platform.openai.com</a><br>2. Create an API key<br>3. Paste it below</p><div class="key-input"><input id="coach-key" type="password" placeholder="sk-…"><button class="btn primary" onclick="let v=document.getElementById(\'coach-key\').value.trim();if(!v)return toast(\'Paste a key first\');state.settings.openaiKey=v;save();toast(\'Key saved!\');renderCoach()"><i class="fa-solid fa-check"></i></button></div><p style="margin-top:12px;font-size:11px;color:var(--faint)">Your key stays on your device only. Never sent anywhere except OpenAI.</p></div>':'';let quickBtns=k?'<div class="coach-quick"><button class="btn" onclick="askCoach(\'Analyze my recent sessions. How should I progress this week? Give specific weight/rep recommendations for each exercise.\')"><i class="fa-solid fa-chart-line"></i> Progress tips</button><button class="btn" onclick="askCoach(\'Look at my logged weights across sessions. Which exercises am I ready to increase weight on? Which should stay the same?\')"><i class="fa-solid fa-weight-hanging"></i> Weight check</button><button class="btn" onclick="askCoach(\'Review my training plan and suggest specific adjustments based on my goals and recent performance. Consider exercise selection, volume, and intensity.\')"><i class="fa-solid fa-sliders"></i> Plan adjust</button><button class="btn" onclick="askCoach(\'I feel like I\\\'m hitting a plateau. Analyze my data and suggest specific changes to break through — different rep ranges, exercise swaps, or intensity techniques.\')"><i class="fa-solid fa-bolt"></i> Beat plateau</button></div>':'';let msgs=k?'<div id="coach-msgs">'+coachMsgs.map(m=>'<div class="ai-msg '+(m.role==='user'?'user':'ai')+'">'+(m.role==='user'?'<b><i class="fa-solid fa-user"></i> You</b><div>'+esc(m.text)+'</div>':'<b><i class="fa-solid fa-robot"></i> AI Coach</b><div>'+fmtAI(m.text)+'</div>')+'</div>').join('')+'</div><div id="coach-loading" class="ai-loading hidden"><i class="fa-solid fa-brain"></i> Analyzing your training data…</div>':'';let input=k?'<div class="coach-input"><input id="coach-q" placeholder="Ask your AI coach anything…" onkeydown="if(event.key===\'Enter\')sendCoach()"><button class="btn primary" onclick="sendCoach()" style="min-width:44px"><i class="fa-solid fa-paper-plane"></i></button></div>':'';document.getElementById('coach').innerHTML='<button class="btn" onclick="showView(\'home\')"><i class="fa-solid fa-arrow-left"></i> Home</button><h2><i class="fa-solid fa-robot" style="color:var(--red)"></i> AI Coach</h2><p class="date">Powered by ChatGPT · Your data stays on-device</p>'+setup+quickBtns+msgs+input}
save();renderHome();
</script></body></html>
