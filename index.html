<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0a1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Train with John</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root{--bg:#06070d;--card:#12141f;--card2:#1a1d2e;--border:#252840;--text:#f1f5f9;--muted:#8b8fa7;--faint:#5a5e7a;--red:#ff4d6d;--red2:#c9184a;--blue:#4361ee;--green:#06d6a0;--amber:#ffd166;--purple:#9b5de5;--shadow:0 8px 32px #0002;--glass:rgba(18,20,31,.7);--radius:16px;--glow:0 0 40px #ff4d6d20}
    [data-theme="light"]{--bg:#f0f2f5;--card:#ffffff;--card2:#f7f8fa;--border:#e0e3eb;--text:#0f172a;--muted:#64687a;--faint:#8b8fa7;--glass:rgba(255,255,255,.85);--shadow:0 8px 32px #0f172a0a;--glow:none}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html{background:var(--bg)}
    body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 'Inter',system-ui,-apple-system,sans-serif;min-height:100vh;min-height:100dvh;padding:0;overflow-x:hidden;-webkit-font-smoothing:antialiased}
    button,input,select{font:inherit}button{border:0;color:inherit;cursor:pointer;min-height:44px}button:active{transform:scale(.97);transition:transform .1s}a{color:var(--blue);text-decoration:none}

    .app{max-width:600px;margin:auto;min-height:100vh;min-height:100dvh;padding:0 16px;padding-top:max(16px, env(safe-area-inset-top));padding-bottom:calc(80px + env(safe-area-inset-bottom))}

    /* ── Bottom Nav ── */
    .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;justify-content:center;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
    .bottom-nav .nav-inner{display:flex;max-width:600px;width:100%}
    .bottom-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;background:none;font-size:10px;font-weight:600;color:var(--faint);letter-spacing:.03em;min-height:52px;transition:color .2s}
    .bottom-nav button.active{color:var(--red)}
    .bottom-nav button i{font-size:20px;transition:transform .2s}
    .bottom-nav button.active i{transform:scale(1.15)}

    /* ── Header ── */
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 0 8px}
    .brand{display:flex;align-items:center;gap:12px}
    .brand .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--red),var(--blue));display:grid;place-items:center;font-size:18px;font-weight:800;color:white;flex-shrink:0}
    .brand .brand-text small{display:block;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
    .brand .brand-text h1{font-size:20px;margin:0;font-weight:700}
    .eyebrow{display:block;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
    .icon-btn{width:40px;height:40px;border-radius:12px;background:var(--card2);display:grid;place-items:center;font-size:16px;min-height:40px}

    /* ── Views ── */
    .view{animation:slide .3s ease both}.hidden{display:none!important}
    @keyframes slide{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

    /* ── Hero Card ── */
    .hero{background:linear-gradient(135deg,#ff4d6d15,#4361ee10);border:1px solid var(--border);border-radius:20px;padding:24px 20px;margin:12px 0 20px;position:relative;overflow:hidden}
    .hero::before{content:'';position:absolute;top:-50%;right:-30%;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,#ff4d6d15,transparent 70%)}
    .hero .hero-greeting{font-size:14px;color:var(--muted);font-weight:500}
    .hero h2{font-size:26px;font-weight:800;margin:4px 0 16px;background:linear-gradient(135deg,var(--text),var(--muted));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .hero-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
    .hero-stat{text-align:center}
    .hero-stat .num{font-size:24px;font-weight:800;color:var(--red)}
    .hero-stat .lbl{font-size:11px;color:var(--muted);font-weight:500;margin-top:2px}

    /* ── Week Strip ── */
    .week-strip{display:flex;gap:10px;overflow-x:auto;margin:0 -16px 20px;padding:0 16px 8px;scrollbar-width:none;scroll-snap-type:x mandatory}
    .week-strip::-webkit-scrollbar{display:none}
    .week{background:var(--card);border:1px solid var(--border);border-radius:14px;min-width:110px;padding:12px;text-align:left;scroll-snap-align:start;transition:all .2s}
    .week.active{border-color:var(--red);background:linear-gradient(135deg,#ff4d6d10,#ff4d6d05);box-shadow:0 0 0 1px var(--red),var(--glow)}
    .week b{display:block;font-size:14px;font-weight:700}
    .week span{font-size:11px;color:var(--muted);display:block;margin-top:3px;font-weight:500}
    .progress{height:4px;border-radius:9px;background:var(--card2);overflow:hidden;margin-top:8px}
    .progress i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#06d6a0cc);border-radius:9px;transition:width .5s ease}

    /* ── Cards ── */
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin:10px 0;box-shadow:var(--shadow);animation:reveal .35s both}
    .card:nth-of-type(2){animation-delay:.06s}.card:nth-of-type(3){animation-delay:.12s}.card:nth-of-type(4){animation-delay:.18s}
    @keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

    /* ── Day Cards ── */
    .day-card{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--radius);overflow:hidden;position:relative}
    .day-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent,var(--red));border-radius:0 4px 4px 0}
    .day-icon{width:48px;height:48px;border-radius:14px;background:var(--card2);display:grid;place-items:center;font-size:22px;flex-shrink:0}
    .day-card .main{flex:1;min-width:0}
    .day-card h3{margin:2px 0 4px;font-size:16px;font-weight:700}
    .day-card p{margin:0;color:var(--muted);font-size:13px;font-weight:500}
    .pill{font-size:11px;color:var(--muted);border:1px solid var(--border);padding:3px 8px;border-radius:99px;font-weight:500}
    .done-badge{color:var(--green);font-size:26px;animation:pop .3s both}
    @keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}

    /* ── Buttons ── */
    .btn{border-radius:12px;background:var(--card2);padding:10px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px;transition:all .15s}
    .btn:hover{background:var(--border)}
    .btn.primary{background:linear-gradient(135deg,var(--red),var(--red2));color:white;box-shadow:0 4px 16px #ff4d6d30}
    .btn.primary:hover{box-shadow:0 6px 24px #ff4d6d40}
    .btn.green{background:linear-gradient(135deg,var(--green),#059669);color:#052e20;box-shadow:0 4px 16px #06d6a030}
    .btn.danger{background:#ef444415;color:#f87171}.btn.full{width:100%;justify-content:center}
    .row{display:flex;gap:9px;align-items:center}.row.wrap{flex-wrap:wrap}.spacer{flex:1}
    .section-title{margin:28px 0 10px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:700}

    /* ── Workout View ── */
    .session-head{display:flex;gap:12px;align-items:center;padding:8px 0 4px}
    .session-head h2{font-size:22px;margin:0;font-weight:700}
    .exercise{border-left:3px solid var(--border);border-radius:var(--radius);overflow:hidden}
    .exercise.priority{border-left-color:var(--amber)}
    .exercise h3{margin:0 0 6px;font-size:16px;font-weight:700}

    /* ── Exercise Header with Image ── */
    .ex-head{display:flex;align-items:center;gap:14px;margin-bottom:10px}
    .ex-img{width:64px;height:64px;border-radius:14px;object-fit:cover;background:var(--card2);flex-shrink:0;border:2px solid var(--border)}
    .ex-thumb{width:64px;height:64px;border-radius:14px;object-fit:cover;background:var(--card2);flex-shrink:0;cursor:pointer;border:2px solid var(--border);transition:.2s}
    .ex-thumb:active{border-color:var(--red);transform:scale(.95)}
    .ex-thumb-ph{width:64px;height:64px;border-radius:14px;background:var(--card2);flex-shrink:0;display:grid;place-items:center;color:var(--faint);cursor:pointer;border:2px dashed var(--border);font-size:20px;transition:.2s}
    .ex-thumb-ph:active{border-color:var(--red);color:var(--red)}
    .muscles{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
    .muscles span{font-size:10px;padding:3px 8px;border-radius:8px;background:#4361ee18;color:#7b93f5;font-weight:600;letter-spacing:.02em}

    /* ── Set Grid ── */
    .set-grid{display:grid;grid-template-columns:32px 1fr 1fr;gap:6px;align-items:center;margin:4px 0}
    .set-grid label{color:var(--faint);text-align:center;font-size:13px;font-weight:700}
    .set-grid input,.setting input{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:12px;color:var(--text);min-height:44px;padding:10px;font-weight:500;transition:border-color .2s}
    .set-grid input:focus,.setting input:focus{outline:none;border-color:var(--blue)}
    .set-grid input:valid:not(:placeholder-shown){border-color:var(--green);animation:flash .5s}
    @keyframes flash{50%{background:#06d6a020}}
    .set-header{display:grid;grid-template-columns:32px 1fr 1fr;gap:6px;margin-bottom:4px}
    .set-header span{font-size:11px;color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
    .set-header span:first-child{text-align:center}

    /* ── Exercise Tools ── */
    .exercise-tools{display:flex;align-items:center;gap:8px;margin:12px 0 0;flex-wrap:wrap}
    .exercise-tools .btn{font-size:12px;padding:8px 10px;min-height:36px}
    .exercise-tools a{font-size:12px;color:var(--blue);font-weight:600;display:inline-flex;align-items:center;gap:4px}
    .demo{margin-top:10px;max-height:0;overflow:hidden;transition:max-height .35s ease}
    .demo.open{max-height:280px}
    .demo img{width:100%;max-height:260px;object-fit:contain;border-radius:12px;background:#000}

    /* ── Timer ── */
    .timer{position:relative;width:52px;height:52px;background:transparent;padding:0;min-height:0}
    .timer svg{width:52px;height:52px;transform:rotate(-90deg)}
    .timer circle{fill:none;stroke:var(--border);stroke-width:4}
    .timer .arc{stroke:var(--amber);stroke-linecap:round;stroke-dasharray:138;transition:stroke-dashoffset .8s linear}
    .timer b{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:700}
    .timer.done .arc{stroke:var(--green)}

    /* ── Settings ── */
    .setting{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:14px 16px}
    .setting b{font-weight:600;font-size:14px}
    .setting p{margin:2px 0 0;color:var(--muted);font-size:12px}
    .switch{appearance:none;width:48px;height:28px;border-radius:99px;background:var(--border);position:relative;min-height:0;cursor:pointer;transition:background .2s}
    .switch:checked{background:var(--red)}
    .switch::before{content:"";position:absolute;left:4px;top:4px;width:20px;height:20px;border-radius:50%;background:white;transition:.2s}
    .switch:checked::before{transform:translateX(20px)}

    /* ── History ── */
    .history-card{display:flex;align-items:center;gap:12px;padding:14px 16px}
    .history-icon{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--red)15,var(--blue)15);display:grid;place-items:center;font-size:16px;color:var(--red);flex-shrink:0}
    .history-card .main{flex:1;min-width:0}
    .history-card .main b{font-weight:600;font-size:14px}
    .history-card .date{color:var(--muted);font-size:12px;font-weight:500}
    .list-input{display:grid;grid-template-columns:1fr 44px 44px 44px;gap:6px}
    .list-input input{background:var(--card2);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:8px}

    /* ── Toast ── */
    .toast{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-120px);background:var(--card);border:1px solid var(--border);padding:12px 20px;border-radius:14px;box-shadow:0 8px 32px #0006;z-index:200;transition:.35s cubic-bezier(.22,1,.36,1);font-weight:600;font-size:14px;backdrop-filter:blur(12px)}
    .toast.show{transform:translate(-50%,0)}

    /* ── Celebrate ── */
    .celebrate{position:fixed;inset:0;background:rgba(6,7,13,.92);backdrop-filter:blur(8px);z-index:150;display:grid;place-content:center;text-align:center}
    .celebrate .mark{font-size:80px;color:var(--green);animation:pop .55s both}
    .celebrate h2{margin:12px 0 4px;font-size:28px;font-weight:800}
    .celebrate p{color:var(--muted);font-size:15px}
    .dot{position:absolute;border-radius:50%;width:10px;height:10px;background:var(--red);animation:confetti 2.4s ease-in infinite}
    @keyframes confetti{from{transform:translateY(30px);opacity:1}to{transform:translateY(-70vh) rotate(360deg);opacity:0}}

    /* ── AI Coach ── */
    .ai-msg{padding:14px 16px;border-radius:16px;margin:8px 0;animation:reveal .3s both;line-height:1.6;font-size:14px}
    .ai-msg.user{background:var(--card2);border:1px solid var(--border)}
    .ai-msg.ai{background:linear-gradient(135deg,#4361ee10,#ff4d6d08);border:1px solid #4361ee25}
    .ai-msg b{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
    .coach-input{display:flex;gap:8px;position:sticky;bottom:calc(68px + env(safe-area-inset-bottom));padding:12px 0;background:var(--bg)}
    .coach-input input{flex:1;background:var(--card2);border:1px solid var(--border);border-radius:14px;color:var(--text);padding:12px 16px;min-height:48px;font-weight:500}
    .coach-input input:focus{outline:none;border-color:var(--blue)}
    .coach-quick{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
    .coach-quick button{font-size:13px;padding:10px 14px;min-height:40px;border-radius:12px}
    .ai-setup{text-align:center;padding:32px 20px}
    .ai-setup .setup-icon{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,var(--red),var(--blue));display:grid;place-items:center;font-size:32px;color:white;margin:0 auto 16px}
    .ai-setup h3{margin:8px 0;font-size:20px;font-weight:700}
    .ai-setup p{color:var(--muted);font-size:14px;margin:6px 0 16px;line-height:1.6}
    .ai-setup a{color:var(--red);font-weight:700}
    .key-input{display:flex;gap:8px;margin-top:16px;max-width:360px;margin-left:auto;margin-right:auto}
    .key-input input{flex:1;background:var(--card2);border:1px solid var(--border);border-radius:12px;color:var(--text);padding:10px 14px;font-size:14px;min-height:48px}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .ai-loading{text-align:center;padding:20px;color:var(--muted);animation:pulse 1.2s ease-in-out infinite;font-weight:500}
    .empty{text-align:center;padding:30px;color:var(--muted);font-size:14px}

    /* ── Muscle Icons Map ── */
    .day-emoji{font-size:24px;line-height:1}
  </style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">J</div>
      <div class="brand-text"><small>Train with John</small><h1 id="title">Dashboard</h1></div>
    </div>
  </header>
  <section id="home" class="view"></section>
  <section id="workout" class="view hidden"></section>
  <section id="history" class="view hidden"></section>
  <section id="settings" class="view hidden"></section>
  <section id="customize" class="view hidden"></section>
  <section id="coach" class="view hidden"></section>
</main>

<nav class="bottom-nav">
  <div class="nav-inner">
    <button id="nav-home" class="active" onclick="showView('home')"><i class="fa-solid fa-house"></i><span>Home</span></button>
    <button id="nav-history" onclick="showView('history')"><i class="fa-solid fa-chart-line"></i><span>History</span></button>
    <button id="nav-coach" onclick="showView('coach')"><i class="fa-solid fa-robot"></i><span>Coach</span></button>
    <button id="nav-settings" onclick="showView('settings')"><i class="fa-solid fa-gear"></i><span>Settings</span></button>
  </div>
</nav>

<div id="toast" class="toast"></div>
<div id="celebrate" class="celebrate hidden">
  <div class="mark"><i class="fa-solid fa-circle-check"></i></div>
  <h2>Workout Complete!</h2>
  <p>Great work — recovery starts now.</p>
</div>

<script>
const DAY_EMOJI={upper_a:'&#128170;',upper_b:'&#128170;',lower_a:'&#129461;',lower_b:'&#129461;'};
const DEFAULT_PLAN={upper_a:{id:'upper_a',label:'Upper A',subtitle:'Back + Shoulders (Strength)',day:'Day 1',color:'#ff4d6d',weekday:'Monday',exercises:[['barbell_row','Barbell Row',4,'6-8',120,1],['db_shoulder_press','Seated DB Shoulder Press',4,'6-10',90,1],['cable_lat_raise_a','Cable Lateral Raise',4,'12-18',45,1],['flat_chest_press','Flat DB / Machine Press',3,'8-10',75],['face_pull','Face Pull',3,'15-20',60]]},lower_a:{id:'lower_a',label:'Lower A',subtitle:'Legs (Maint) + Core',day:'Day 2',color:'#4361ee',weekday:'Tuesday',exercises:[['leg_press','Leg Press / Squat',3,'8-10',90],['rdl','Romanian Deadlift',3,'8-10',90,1],['hanging_leg_raise','Hanging Leg Raise',3,'10-15',60,1],['pallof_press','Pallof Press',3,'10/side',45,1],['dead_bug','Dead Bug',2,'8/side',45,1]]},upper_b:{id:'upper_b',label:'Upper B',subtitle:'Shoulders + Back (Volume)',day:'Day 3',color:'#ff4d6d',weekday:'Thursday',exercises:[['lat_pulldown','Lat Pulldown (Wide)',4,'8-12',90,1],['cable_lat_raise_b','Cable Lateral Raise',4,'15-20',45,1],['chest_sup_row','Chest-Supported DB Row',3,'10-12',75,1],['rear_delt_fly','Rear Delt Cable Fly',3,'15-20',45],['incline_db_press','Incline DB Press',3,'8-10',75]]},lower_b:{id:'lower_b',label:'Lower B',subtitle:'Legs (Light) + Core + Cardio',day:'Day 4',color:'#4361ee',weekday:'Friday',exercises:[['hip_thrust','Hip Thrust',3,'10-12',90,1],['walking_lunge','Walking Lunge',2,'10/leg',75],['ab_wheel','Ab Wheel Rollout',3,'8-12',60,1],['plank','Plank',3,'30-60s',30,1]]}};
const PLAN_ORDER=['upper_a','lower_a','upper_b','lower_b'];
const INFO={barbell_row:['Back|Lats|Rhomboids','https://musclewiki.com/barbell/male/back/barbell-bent-over-row','https://weighttraining.guide/wp-content/uploads/2016/10/Barbell-Bent-Over-Row.gif'],db_shoulder_press:['Shoulders|Front Delt|Triceps','https://musclewiki.com/dumbbells/male/shoulders/dumbbell-seated-overhead-press','https://weighttraining.guide/wp-content/uploads/2016/05/Dumbbell-Shoulder-Press.gif'],cable_lat_raise_a:['Shoulders|Side Delt','https://musclewiki.com/cables/male/shoulders/cable-lateral-raise','https://weighttraining.guide/wp-content/uploads/2017/01/cable-one-arm-lateral-raise.gif'],cable_lat_raise_b:['Shoulders|Side Delt','https://musclewiki.com/cables/male/shoulders/cable-lateral-raise','https://weighttraining.guide/wp-content/uploads/2017/01/cable-one-arm-lateral-raise.gif'],flat_chest_press:['Chest|Triceps','https://musclewiki.com/dumbbells/male/chest/dumbbell-bench-press','https://weighttraining.guide/wp-content/uploads/2016/12/Dumbbell-Press.gif'],face_pull:['Rear Delt|Upper Back','https://musclewiki.com/cables/male/rear-deltoid/cable-face-pull','https://weighttraining.guide/wp-content/uploads/2022/01/Cable-Face-Pull.gif'],leg_press:['Quads|Glutes','https://musclewiki.com/machine/male/quads/machine-leg-press','https://weighttraining.guide/wp-content/uploads/2016/05/Leg-Press.gif'],rdl:['Hamstrings|Glutes|Lower Back','https://musclewiki.com/barbell/male/hamstrings/barbell-romanian-deadlift','https://weighttraining.guide/wp-content/uploads/2017/09/barbell-romanian-deadlift.gif'],hanging_leg_raise:['Abs|Hip Flexors','https://musclewiki.com/bodyweight/male/abs/hanging-leg-raise','https://weighttraining.guide/wp-content/uploads/2021/08/Hanging-Leg-Raise.gif'],pallof_press:['Core|Obliques','https://musclewiki.com/cables/male/abs/cable-pallof-press','https://weighttraining.guide/wp-content/uploads/2020/08/Pallof-Press.gif'],dead_bug:['Core|Deep Abs','https://musclewiki.com/bodyweight/male/abs/dead-bug','https://weighttraining.guide/wp-content/uploads/2021/08/Dead-Bug.gif'],lat_pulldown:['Back|Lats|Biceps','https://musclewiki.com/cables/male/lats/cable-lat-pulldown','https://weighttraining.guide/wp-content/uploads/2016/05/Wide-Grip-Lat-Pulldown.gif'],chest_sup_row:['Back|Rhomboids|Rear Delt','https://musclewiki.com/dumbbells/male/back/dumbbell-chest-supported-row','https://weighttraining.guide/wp-content/uploads/2022/11/Chest-Supported-Dumbbell-Row.gif'],rear_delt_fly:['Rear Delt|Upper Back','https://musclewiki.com/cables/male/rear-deltoid/cable-reverse-fly','https://weighttraining.guide/wp-content/uploads/2018/11/Cable-Rear-Delt-Fly.gif'],incline_db_press:['Upper Chest|Shoulders','https://musclewiki.com/dumbbells/male/chest/dumbbell-incline-bench-press','https://weighttraining.guide/wp-content/uploads/2016/12/incline-dumbbell-press.gif'],hip_thrust:['Glutes|Hamstrings','https://musclewiki.com/barbell/male/glutes/barbell-hip-thrust','https://weighttraining.guide/wp-content/uploads/2016/05/Barbell-Hip-Thrust.gif'],walking_lunge:['Quads|Glutes','https://musclewiki.com/dumbbells/male/quads/dumbbell-lunge','https://weighttraining.guide/wp-content/uploads/2016/10/Dumbbell-Lunge.gif'],ab_wheel:['Core|Abs|Shoulders','https://musclewiki.com/bodyweight/male/abs/ab-wheel','https://weighttraining.guide/wp-content/uploads/2016/10/Ab-Wheel-Rollout.gif'],plank:['Core|Full Abs','https://musclewiki.com/bodyweight/male/abs/plank','https://weighttraining.guide/wp-content/uploads/2021/06/Front-Plank.gif']};

const clone=o=>JSON.parse(JSON.stringify(o));
const load=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))||fallback}catch(e){return fallback}};

let exercisePhotos=load('ph2_exercise_photos',{});
function compressPhoto(file,sz=200){return new Promise(r=>{let rd=new FileReader;rd.onload=e=>{let img=new Image;img.onload=()=>{let c=document.createElement('canvas'),w=img.width,h=img.height;if(w>sz||h>sz){if(w>h){h=h*sz/w;w=sz}else{w=w*sz/h;h=sz}}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);r(c.toDataURL('image/jpeg',.7))};img.src=e.target.result};rd.readAsDataURL(file)})}
function addExPhoto(id){let inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=async()=>{if(!inp.files[0])return;exercisePhotos[id]=await compressPhoto(inp.files[0]);localStorage.setItem('ph2_exercise_photos',JSON.stringify(exercisePhotos));renderWorkout();toast('Photo saved')};inp.click()}
function removeExPhoto(id){delete exercisePhotos[id];localStorage.setItem('ph2_exercise_photos',JSON.stringify(exercisePhotos));renderWorkout();toast('Photo removed')}

let state={plan:load('ph2_plan',clone(DEFAULT_PLAN)),history:load('ph2_history',[]),settings:Object.assign({startDate:localStorage.getItem('ph2_start_date')||new Date().toISOString().slice(0,10),targetWeight:'73',targetWaist:'',theme:'dark',restSound:true,units:'kg',geminiKey:''},load('ph2_settings',{})),week:1,active:null,edit:null,timer:null};

function save(){localStorage.setItem('ph2_plan',JSON.stringify(state.plan));localStorage.setItem('ph2_history',JSON.stringify(state.history));localStorage.setItem('ph2_settings',JSON.stringify(state.settings));localStorage.setItem('ph2_start_date',state.settings.startDate);document.documentElement.dataset.theme=state.settings.theme}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function date(d){return new Date(d+'T12:00:00')}
function weekDates(n){let s=date(state.settings.startDate);s.setDate(s.getDate()+(n-1)*7);let e=new Date(s);e.setDate(e.getDate()+6);let opt={month:'short',day:'numeric'};return s.toLocaleDateString(undefined,opt)+' – '+e.toLocaleDateString(undefined,opt)}
function sessionWeek(s){return Math.max(1,Math.floor((date(s.date)-date(state.settings.startDate))/86400000/7)+1)}
function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}

function updateNav(id){document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.remove('active'));let navId='nav-'+(id==='customize'?'settings':id==='workout'?'home':id);let el=document.getElementById(navId);if(el)el.classList.add('active')}

function showView(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  let titles={home:'Dashboard',workout:'Workout',history:'History',settings:'Settings',customize:'Customize',coach:'AI Coach'};
  document.getElementById('title').textContent=titles[id]||id;
  updateNav(id);
  if(id==='home')renderHome();if(id==='history')renderHistory();if(id==='settings')renderSettings();if(id==='customize')renderCustomize();if(id==='coach')renderCoach();
  window.scrollTo({top:0,behavior:'smooth'})
}

function getStreak(){let days=[...new Set(state.history.map(s=>s.date))].sort().reverse();if(!days.length)return 0;let streak=0;let d=new Date();d.setHours(12,0,0,0);for(let i=0;i<days.length;i++){let diff=Math.round((d-date(days[i]))/86400000);if(diff<=1+i){streak++}else break}return streak}

function renderHome(){
  let completed=state.history.filter(s=>sessionWeek(s)===state.week);
  let totalSessions=state.history.length;
  let streak=getStreak();
  let weekDone=completed.length;

  let ws='';
  for(let n=1;n<=12;n++){
    let c=state.history.filter(s=>sessionWeek(s)===n).length;
    ws+='<button class="week '+(n===state.week?'active':'')+'" onclick="state.week='+n+';renderHome()"><b>Week '+n+'</b><span>'+weekDates(n)+'</span><div class="progress"><i style="width:'+Math.min(100,c/4*100)+'%"></i></div><span>'+c+'/4 done</span></button>'
  }

  let cards=Object.values(state.plan).map(p=>{
    let done=completed.some(s=>s.dayId===p.id);
    let emoji=DAY_EMOJI[p.id]||'&#127947;';
    return '<article class="card day-card" style="--accent:'+p.color+'"><div class="day-icon"><span class="day-emoji">'+emoji+'</span></div><div class="main"><span class="eyebrow">'+esc(p.day)+' · '+esc(p.weekday)+'</span><h3>'+esc(p.label)+'</h3><p>'+esc(p.subtitle)+'</p></div>'+(done?'<i class="fa-solid fa-circle-check done-badge"></i>':'<button class="btn primary" onclick="startWorkout(\''+p.id+'\')">Start</button>')+'</article>'
  }).join('');

  document.getElementById('home').innerHTML=
    '<div class="hero"><div class="hero-greeting">Week '+state.week+' of 12</div><h2>Keep pushing forward</h2><div class="hero-stats"><div class="hero-stat"><div class="num">'+weekDone+'/4</div><div class="lbl">This week</div></div><div class="hero-stat"><div class="num">'+totalSessions+'</div><div class="lbl">Total sessions</div></div><div class="hero-stat"><div class="num">'+streak+'</div><div class="lbl">Day streak</div></div></div></div>'+
    '<div class="week-strip">'+ws+'</div>'+
    '<div class="section-title">This week\'s plan</div>'+cards+
    '<div style="margin-top:16px"><button class="btn full" onclick="showView(\'customize\')"><i class="fa-solid fa-sliders"></i> Customize plan</button></div>'
}

function youtubeUrl(name){return 'https://www.youtube.com/results?search_query='+encodeURIComponent(name+' exercise proper form')}
function startWorkout(id,edit){state.active=clone(state.plan[id]);state.edit=edit||null;renderWorkout();showView('workout')}

function renderWorkout(){
  let p=state.active;if(!p)return;
  let prior=state.edit&&state.edit.entries||{};
  let exercises=p.exercises.map((x,ei)=>{
    let i=INFO[x[0]]||['Custom exercise','',''];
    let ph=exercisePhotos[x[0]];
    let imgSrc=ph||i[2];

    let sets='<div class="set-header"><span>#</span><span>Weight ('+state.settings.units+')</span><span>Reps</span></div>';
    for(let n=0;n<x[2];n++){
      let v=prior[x[0]]&&prior[x[0]][n]||{};
      sets+='<div class="set-grid"><label>'+(n+1)+'</label><input inputmode="decimal" placeholder="—" value="'+esc(v.weight||'')+'" data-ex="'+x[0]+'" data-set="'+n+'" data-field="weight"><input inputmode="numeric" placeholder="—" value="'+esc(v.reps||'')+'" data-ex="'+x[0]+'" data-set="'+n+'" data-field="reps"></div>'
    }

    return '<article class="card exercise '+(x[5]?'priority':'')+'">'+
      '<div class="ex-head">'+
        (ph?'<img class="ex-thumb" src="'+ph+'" alt="" loading="lazy" onclick="addExPhoto(\''+x[0]+'\')">':
         imgSrc?'<img class="ex-img" src="'+imgSrc+'" alt="'+esc(x[1])+'" loading="lazy" onerror="this.style.display=\'none\'">':
         '<div class="ex-thumb-ph" onclick="addExPhoto(\''+x[0]+'\')"><i class="fa-solid fa-dumbbell"></i></div>')+
        '<div><h3>'+esc(x[1])+'</h3><div class="muscles">'+i[0].split('|').map(m=>'<span>'+m+'</span>').join('')+'</div></div>'+
      '</div>'+
      '<div class="row" style="margin-bottom:12px"><span class="pill">'+x[2]+' sets</span><span class="pill">'+esc(x[3])+' reps</span><span class="pill">'+x[4]+'s rest</span><span class="spacer"></span><button class="timer" id="timer-'+ei+'" onclick="runTimer('+ei+','+x[4]+')"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="22"></circle><circle class="arc" cx="26" cy="26" r="22"></circle></svg><b>'+x[4]+'</b></button></div>'+
      '<div class="exercise-tools">'+
        '<button class="btn" onclick="addExPhoto(\''+x[0]+'\')"><i class="fa-solid fa-camera"></i> '+(ph?'Change':'Photo')+'</button>'+
        (ph?'<button class="btn" onclick="removeExPhoto(\''+x[0]+'\')"><i class="fa-solid fa-xmark"></i></button>':'')+
        '<button class="btn" onclick="toggleDemo('+ei+')"><i class="fa-solid fa-play"></i> Demo</button>'+
        '<a href="'+youtubeUrl(x[1])+'" target="_blank" rel="noopener"><i class="fa-brands fa-youtube"></i> YouTube</a>'+
      '</div>'+
      '<div id="demo-'+ei+'" class="demo">'+(i[2]?'<img src="'+i[2]+'" alt="'+esc(x[1])+'" loading="lazy" onerror="this.parentElement.innerHTML=\'<p class=empty>Image unavailable. Try the YouTube link.</p>\'">':'<p class="empty">Use the YouTube link for this exercise.</p>')+'</div>'+
      '<div style="margin-top:14px">'+sets+'</div>'+
    '</article>'
  }).join('');

  document.getElementById('workout').innerHTML=
    '<div class="session-head"><button class="icon-btn" onclick="showView(\'home\')"><i class="fa-solid fa-arrow-left"></i></button><div><h2>'+esc(p.label)+'</h2><span class="eyebrow">'+esc(p.subtitle)+'</span></div></div>'+
    exercises+
    '<button class="btn green full" style="margin-top:16px;padding:14px" onclick="finishWorkout()"><i class="fa-solid fa-circle-check"></i> '+(state.edit?'Save changes':'Finish workout')+'</button>'
}

function toggleDemo(i){document.getElementById('demo-'+i).classList.toggle('open')}
function runTimer(i,total){if(state.timer){clearInterval(state.timer);state.timer=null;toast('Rest timer skipped');return}let el=document.getElementById('timer-'+i),left=total;el.classList.remove('done');let tick=()=>{let pct=138*(1-left/total);el.querySelector('.arc').style.strokeDashoffset=pct;el.querySelector('b').textContent=left;if(left--<=0){clearInterval(state.timer);state.timer=null;el.classList.add('done');el.querySelector('b').textContent='✓';navigator.vibrate&&navigator.vibrate(300);if(state.settings.restSound)try{new AudioContext().createOscillator().start()}catch(e){}}};tick();state.timer=setInterval(tick,1000)}
function collect(){let entries={};document.querySelectorAll('[data-ex]').forEach(i=>{let e=i.dataset.ex,s=i.dataset.set;entries[e]=entries[e]||[];entries[e][s]=entries[e][s]||{};entries[e][s][i.dataset.field]=i.value});return entries}
function finishWorkout(){let entry={id:state.edit?state.edit.id:Date.now().toString(),dayId:state.active.id,label:state.active.label,date:state.edit?state.edit.date:new Date().toISOString().slice(0,10),entries:collect()};if(state.edit)state.history=state.history.map(s=>s.id===entry.id?entry:s);else state.history.unshift(entry);save();document.getElementById('celebrate').classList.remove('hidden');setTimeout(()=>{document.getElementById('celebrate').classList.add('hidden');showView('home')},2500)}

function renderHistory(){
  let list=state.history.map(s=>
    '<article class="card history-card"><div class="history-icon"><i class="fa-solid fa-dumbbell"></i></div><div class="main"><b>'+esc(s.label)+'</b><div class="date">'+new Date(s.date+'T12:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})+' · Week '+sessionWeek(s)+'</div></div><button class="icon-btn" onclick="editSession(\''+s.id+'\')" aria-label="Edit"><i class="fa-solid fa-pen"></i></button><button class="icon-btn" onclick="deleteSession(\''+s.id+'\')" aria-label="Delete"><i class="fa-solid fa-trash"></i></button></article>'
  ).join('')||'<div class="empty"><i class="fa-solid fa-dumbbell" style="font-size:32px;display:block;margin-bottom:12px;opacity:.3"></i>Your completed workouts will appear here.</div>';
  document.getElementById('history').innerHTML='<div class="section-title">All sessions</div>'+list
}
function editSession(id){let s=state.history.find(x=>x.id===id);startWorkout(s.dayId,s)}
function deleteSession(id){if(confirm('Delete this saved workout?')){state.history=state.history.filter(s=>s.id!==id);save();renderHistory();toast('Session deleted')}}

function renderSettings(){
  let s=state.settings;
  document.getElementById('settings').innerHTML=
    '<div class="section-title">Program</div>'+
    '<div class="card setting"><div><b>Week 1 start date</b><p>When your 12-week program began</p></div><input type="date" value="'+s.startDate+'" onchange="state.settings.startDate=this.value;save();renderHome()"></div>'+
    '<div class="card setting"><div><b>Target weight</b><p>Your personal goal</p></div><input inputmode="decimal" value="'+esc(s.targetWeight)+'" onchange="state.settings.targetWeight=this.value;save()"></div>'+
    '<div class="card setting"><div><b>Target waist</b><p>Optional measurement</p></div><input inputmode="decimal" value="'+esc(s.targetWaist)+'" onchange="state.settings.targetWaist=this.value;save()"></div>'+
    '<div class="section-title">Preferences</div>'+
    '<div class="card setting"><div><b>Light mode</b><p>Switch visual theme</p></div><input class="switch" type="checkbox" '+(s.theme==='light'?'checked':'')+' onchange="state.settings.theme=this.checked?\'light\':\'dark\';save();renderSettings()"></div>'+
    '<div class="card setting"><div><b>Rest timer sound</b><p>Sound and vibration when done</p></div><input class="switch" type="checkbox" '+(s.restSound?'checked':'')+' onchange="state.settings.restSound=this.checked;save()"></div>'+
    '<div class="card setting"><div><b>Units</b><p>Weight display</p></div><button class="btn" onclick="state.settings.units=state.settings.units===\'kg\'?\'lbs\':\'kg\';save();renderSettings()">'+s.units.toUpperCase()+'</button></div>'+
    '<div class="section-title">AI Coach</div>'+
    '<div class="card setting"><div><b>Gemini API key</b><p>Free at <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a></p></div><input type="password" placeholder="Paste Gemini key…" value="'+esc(s.geminiKey||'')+'" onchange="state.settings.geminiKey=this.value.trim();save();toast(\'API key saved\')"></div>'+
    '<div class="section-title">Data</div>'+
    '<div class="row wrap"><button class="btn" onclick="exportData()"><i class="fa-solid fa-download"></i> Export</button><button class="btn" onclick="document.getElementById(\'importer\').click()"><i class="fa-solid fa-upload"></i> Import</button><input id="importer" class="hidden" type="file" accept="application/json" onchange="importData(this.files[0])"><button class="btn" onclick="showView(\'customize\')"><i class="fa-solid fa-sliders"></i> Customize plan</button></div>'+
    '<button class="btn danger full" style="margin-top:18px" onclick="resetData()"><i class="fa-solid fa-triangle-exclamation"></i> Reset all data</button>'+
    '<p class="empty">Train with John · V2.1</p>'
}

function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({history:state.history,plan:state.plan,settings:state.settings,bodyStats:load('ph2_body_stats',[]),exercisePhotos},null,2)],{type:'application/json'}));a.download='train-with-john-backup.json';a.click();URL.revokeObjectURL(a.href);toast('Backup downloaded')}
function importData(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.history)||!d.plan||!d.settings)throw Error();state.history=d.history;state.plan=d.plan;state.settings=Object.assign(state.settings,d.settings);if(d.exercisePhotos){Object.assign(exercisePhotos,d.exercisePhotos);localStorage.setItem('ph2_exercise_photos',JSON.stringify(exercisePhotos))}save();showView('home');toast('Backup restored')}catch(e){alert('That file is not a valid Train with John backup.')}};r.readAsText(file)}
function resetData(){if(!confirm('Are you sure you want to reset all data?'))return;let t=prompt('This cannot be undone. Type DELETE to confirm.');if(t==='DELETE'){['ph2_history','ph2_body_stats','ph2_plan','ph2_settings','ph2_start_date','ph2_exercise_photos'].forEach(k=>localStorage.removeItem(k));location.reload()}}

function renderCustomize(){
  let days=Object.values(state.plan).map(p=>
    '<article class="card"><div class="row"><div class="main"><b>'+esc(p.label)+'</b><p style="margin:2px 0 0;color:var(--muted);font-size:13px">'+esc(p.subtitle)+'</p></div><button class="icon-btn" onclick="removeDay(\''+p.id+'\')" aria-label="Remove day"><i class="fa-solid fa-trash"></i></button></div><div style="margin-top:14px">'+
    p.exercises.map((x,i)=>
      '<div class="list-input" style="margin:6px 0"><input value="'+esc(x[1])+'" onchange="updateExercise(\''+p.id+'\','+i+',\'name\',this.value)"><input inputmode="numeric" value="'+x[2]+'" onchange="updateExercise(\''+p.id+'\','+i+',\'sets\',this.value)" style="text-align:center"><button class="icon-btn" onclick="moveExercise(\''+p.id+'\','+i+',-1)"><i class="fa-solid fa-arrow-up"></i></button><button class="icon-btn" onclick="removeExercise(\''+p.id+'\','+i+')"><i class="fa-solid fa-minus"></i></button></div>'
    ).join('')+
    '</div><button class="btn" style="margin-top:10px" onclick="addExercise(\''+p.id+'\')"><i class="fa-solid fa-plus"></i> Add exercise</button></article>'
  ).join('');
  document.getElementById('customize').innerHTML=
    '<div class="session-head"><button class="icon-btn" onclick="showView(\'settings\')"><i class="fa-solid fa-arrow-left"></i></button><div><h2>Customize Plan</h2><span class="eyebrow">Edit exercises, sets & order</span></div></div>'+
    days+
    '<div class="row wrap" style="margin-top:16px"><button class="btn primary" onclick="addDay()"><i class="fa-solid fa-plus"></i> Add training day</button><button class="btn danger" onclick="if(confirm(\'Restore the original four-day plan?\')){state.plan=clone(DEFAULT_PLAN);save();renderCustomize()}">Reset defaults</button></div>'
}
function updateExercise(day,i,k,v){let x=state.plan[day].exercises[i];if(k==='name')x[1]=v;else x[2]=Math.max(1,Number(v)||1);save()}
function removeExercise(d,i){state.plan[d].exercises.splice(i,1);save();renderCustomize()}
function moveExercise(d,i,by){let a=state.plan[d].exercises,j=i+by;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();renderCustomize()}
function addExercise(d){let name=prompt('Exercise name');if(!name)return;state.plan[d].exercises.push(['custom_'+Date.now(),name,3,'8-12',60]);save();renderCustomize()}
function addDay(){let name=prompt('Name for the new training day');if(!name)return;let id='custom_'+Date.now();state.plan[id]={id,label:name,subtitle:'Custom training day',day:'Day '+(Object.keys(state.plan).length+1),color:'#ff4d6d',weekday:'Custom',exercises:[]};save();renderCustomize()}
function removeDay(id){if(Object.keys(state.plan).length<=1)return toast('Keep at least one training day');if(confirm('Remove this entire training day?')){delete state.plan[id];save();renderCustomize()}}

let coachMsgs=[],coachBusy=false;
function fmtAI(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\*\*(.*?)\*\*/g,'<b>$1</b>').replace(/\*(.*?)\*/g,'<i>$1</i>').replace(/^[-•] (.+)/gm,'<span style="display:block;padding-left:16px;text-indent:-12px;margin:3px 0">• $1</span>').replace(/^\d+\. (.+)/gm,'<span style="display:block;padding-left:16px;margin:3px 0">$&</span>').replace(/\n/g,'<br>')}
function buildCtx(){let pl=Object.values(state.plan).map(p=>p.label+' ('+p.subtitle+'): '+p.exercises.map(x=>x[1]+' '+x[2]+'×'+x[3]).join(', ')).join('\n');let rc=state.history.slice(0,10).map(s=>{let d=Object.entries(s.entries||{}).map(([e,sets])=>{let nm=(Object.values(state.plan).flatMap(p=>p.exercises).find(x=>x[0]===e)||['',e])[1];return nm+': '+sets.filter(Boolean).map((v,i)=>(v.weight||'?')+state.settings.units+'×'+(v.reps||'?')).join(', ')}).join('; ');return s.label+' ('+s.date+', Wk'+sessionWeek(s)+'): '+d}).join('\n');return 'You are an expert personal trainer AI coach embedded in the "Train with John" workout tracking app. You analyze the user\'s actual workout data to give specific, actionable advice.\n\nCONTEXT:\n- Week '+state.week+' of 12-week program\n- Target weight: '+(state.settings.targetWeight||'not set')+state.settings.units+'\n- Target waist: '+(state.settings.targetWaist||'not set')+'\n- Units: '+state.settings.units+'\n- Total sessions logged: '+state.history.length+'\n\nCURRENT PLAN:\n'+pl+'\n\nRECENT SESSIONS (newest first):\n'+(rc||'No sessions logged yet.')+'\n\nRULES:\n- Reference specific exercises and numbers from their data\n- Be concise: bullet points, under 200 words\n- Give actionable recommendations (exact weight increases, rep targets)\n- Consider progressive overload principles\n- Flag any muscle imbalances or missing movement patterns\n- Be encouraging but honest'}

async function callAI(q){let k=state.settings.geminiKey;if(!k){toast('Add your free Gemini API key in Settings');showView('settings');return null}let el=document.getElementById('coach-loading');if(el)el.classList.remove('hidden');try{let r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key='+encodeURIComponent(k),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({systemInstruction:{parts:[{text:buildCtx()}]},contents:[{parts:[{text:q}]}],generationConfig:{temperature:.7,maxOutputTokens:1024}})});let d=await r.json();if(d.error)throw Error(d.error.message);return d.candidates[0].content.parts[0].text}catch(e){toast('AI error: '+e.message);return null}finally{if(el)el.classList.add('hidden')}}
async function askCoach(q){if(coachBusy)return;coachBusy=true;coachMsgs.push({role:'user',text:q});renderCoachMsgs();let a=await callAI(q);coachBusy=false;if(a){coachMsgs.push({role:'ai',text:a});renderCoachMsgs();let m=document.getElementById('coach-msgs');m.lastChild.scrollIntoView({behavior:'smooth'})}}
function sendCoach(){let inp=document.getElementById('coach-q');let q=inp.value.trim();if(!q)return;inp.value='';askCoach(q)}
function renderCoachMsgs(){let el=document.getElementById('coach-msgs');if(!el)return;el.innerHTML=coachMsgs.map(m=>'<div class="ai-msg '+(m.role==='user'?'user':'ai')+'">'+(m.role==='user'?'<b><i class="fa-solid fa-user"></i> You</b><div>'+esc(m.text)+'</div>':'<b><i class="fa-solid fa-robot"></i> AI Coach</b><div>'+fmtAI(m.text)+'</div>')+'</div>').join('')}

function renderCoach(){
  let k=state.settings.geminiKey;
  let setup=!k?'<div class="card ai-setup"><div class="setup-icon"><i class="fa-solid fa-robot"></i></div><h3>Set up AI Coach</h3><p>Get personalized training advice powered by Google Gemini — <b>100% free</b>, no credit card needed.</p><p>1. Go to <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a><br>2. Click "Create API key"<br>3. Paste it below</p><div class="key-input"><input id="coach-key" type="password" placeholder="Paste your Gemini key…"><button class="btn primary" onclick="let v=document.getElementById(\'coach-key\').value.trim();if(!v)return toast(\'Paste a key first\');state.settings.geminiKey=v;save();toast(\'Key saved!\');renderCoach()"><i class="fa-solid fa-check"></i></button></div><p style="margin-top:14px;font-size:12px;color:var(--faint)">Free forever · Key stays on your device only</p></div>':'';
  let quickBtns=k?'<div class="coach-quick"><button class="btn" onclick="askCoach(\'Analyze my recent sessions. How should I progress this week? Give specific weight/rep recommendations for each exercise.\')"><i class="fa-solid fa-chart-line"></i> Progress tips</button><button class="btn" onclick="askCoach(\'Look at my logged weights across sessions. Which exercises am I ready to increase weight on? Which should stay the same?\')"><i class="fa-solid fa-weight-hanging"></i> Weight check</button><button class="btn" onclick="askCoach(\'Review my training plan and suggest specific adjustments based on my goals and recent performance. Consider exercise selection, volume, and intensity.\')"><i class="fa-solid fa-sliders"></i> Plan adjust</button><button class="btn" onclick="askCoach(\'I feel like I\\\'m hitting a plateau. Analyze my data and suggest specific changes to break through — different rep ranges, exercise swaps, or intensity techniques.\')"><i class="fa-solid fa-bolt"></i> Beat plateau</button></div>':'';
  let msgs=k?'<div id="coach-msgs">'+coachMsgs.map(m=>'<div class="ai-msg '+(m.role==='user'?'user':'ai')+'">'+(m.role==='user'?'<b><i class="fa-solid fa-user"></i> You</b><div>'+esc(m.text)+'</div>':'<b><i class="fa-solid fa-robot"></i> AI Coach</b><div>'+fmtAI(m.text)+'</div>')+'</div>').join('')+'</div><div id="coach-loading" class="ai-loading hidden"><i class="fa-solid fa-brain"></i> Analyzing your training data…</div>':'';
  let input=k?'<div class="coach-input"><input id="coach-q" placeholder="Ask your AI coach anything…" onkeydown="if(event.key===\'Enter\')sendCoach()"><button class="btn primary" onclick="sendCoach()" style="min-width:48px"><i class="fa-solid fa-paper-plane"></i></button></div>':'';
  document.getElementById('coach').innerHTML=
    '<p style="color:var(--muted);font-size:13px;margin:8px 0 0">Powered by Google Gemini (free) · Your data stays on-device</p>'+
    setup+quickBtns+msgs+input
}

save();renderHome();
</script>
</body></html>
